apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:

  name: enterprise-rbac-chatbot

  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/shaikh4git/Enterprise-RBAC-Chatbot-GitOps.git

    targetRevision: main

    path: app

  destination:

    server: https://kubernetes.default.svc

    namespace: enterprise-chatbot

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

      - CreateNamespace=true